# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-yuno"
BBFILE_PATTERN_meta-yuno = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-yuno = "6"

LAYERDEPENDS_meta-yuno = "core"
LAYERSERIES_COMPAT_meta-yuno = "wrynose"
